<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F3">
<meta name="description" content="個人用の生活管理ダッシュボード">
<title>Life OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232E6B5E'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
<style>
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface2:#E9EEEC; --ink:#16262A; --ink2:#33474B;
  --muted:#6C7D7F; --line:#DCE3E1; --accent:#2E6B5E; --accent-soft:#E2EEE9; --now:#B0791A;
  --danger:#A4402F; --radius:14px;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
#app[data-theme="dark"]{
  --bg:#111517; --surface:#1A2022; --surface2:#242B2D; --ink:#E3EAE7; --ink2:#C2CECB;
  --muted:#8B9A99; --line:#2B3335; --accent:#74C2A8; --accent-soft:#1D2C28; --now:#D6A344;
  --danger:#D97A66;
}
#app *{box-sizing:border-box;margin:0;padding:0}
#app{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  min-height:600px; display:flex; border-radius:var(--radius); overflow:hidden;
  border:1px solid var(--line); font-size:14px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
#app button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app input,#app textarea,#app select{font-family:inherit;font-size:14px;color:var(--ink)}
#app ::selection{background:var(--accent-soft)}

/* ---------- sidebar ---------- */
.sb{width:216px;flex:0 0 216px;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 12px}
.sb-brand{padding:4px 10px 18px;display:flex;flex-direction:column;gap:1px}
.sb-brand b{font-size:14px;letter-spacing:.04em;font-weight:600}
.sb-brand span{font-size:10.5px;color:var(--muted);letter-spacing:.14em;font-family:var(--mono)}
.nav{display:flex;flex-direction:column;gap:1px;flex:1}
.nav button{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;
  color:var(--ink2);text-align:left;transition:background .12s,color .12s}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .ic{width:15px;text-align:center;font-size:13px;opacity:.85}
.nav .sep{height:1px;background:var(--line);margin:9px 10px}
.sb-status{font-size:10.5px;color:var(--muted);padding:8px 8px 0;font-family:var(--mono);letter-spacing:.04em}
.sb-status.ng{color:var(--danger);font-weight:600}
.sb-foot{display:flex;flex-wrap:wrap;gap:4px;padding:8px 6px 0;border-top:1px solid var(--line);margin-top:8px}
.sb-foot button{flex:1;padding:6px 2px;border-radius:8px;font-size:11px;color:var(--muted)}
.sb-foot button:hover{background:var(--surface2);color:var(--ink)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;overflow-y:auto;max-height:900px}
.wrap{max-width:980px;padding:34px 40px 80px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.ph h1{font-size:23px;font-weight:600;letter-spacing:.01em}
.ph p{color:var(--muted);font-size:12.5px;margin-top:3px}
.mincho .ph h1{font-family:var(--serif);font-weight:600;letter-spacing:.06em}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.card h3{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin-bottom:13px;
  text-transform:uppercase;font-family:var(--mono)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.btn{background:var(--accent);color:#fff;padding:7px 15px;border-radius:9px;font-size:13px;font-weight:600;
  transition:opacity .12s}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface2);opacity:1}
.btn.sm{padding:5px 11px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;
  background:var(--surface2);color:var(--muted);font-weight:500}
.chip.a{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:#F5E6D2;color:#8A5A12}
#app[data-theme="dark"] .chip.warn{background:#33291A;color:var(--now)}
.empty{color:var(--muted);font-size:13px;padding:22px 0;text-align:center;line-height:2}
.empty b{display:block;color:var(--ink2);font-weight:600;font-size:13.5px}
.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:5px 12px;border-radius:99px;font-size:12.5px;color:var(--muted);border:1px solid transparent}
.tabs button:hover{background:var(--surface2)}
.tabs button.on{background:var(--ink);color:var(--bg);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.sr{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.sr:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* ---------- hero (signature) ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px 26px;margin-bottom:16px;display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.hero-time{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1;
  font-variant-numeric:tabular-nums}
.hero-date{font-size:11.5px;color:var(--muted);letter-spacing:.1em;margin-top:8px;font-family:var(--mono)}
.hero-sep{width:1px;align-self:stretch;background:var(--line)}
.hero-now{flex:1;min-width:190px}
.hero-lb{font-size:10.5px;letter-spacing:.16em;color:var(--now);font-family:var(--mono);font-weight:600}
.hero-title{font-size:19px;font-weight:600;margin-top:5px}
.hero-next{font-size:12.5px;color:var(--muted);margin-top:7px}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.qa button{padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;color:var(--ink2);transition:border-color .12s,color .12s}
.qa button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- task ---------- */
.task{display:flex;align-items:flex-start;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.task[draggable="true"]{cursor:grab}
.task.drag{opacity:.35}
.tk-box{width:16px;height:16px;border:1.6px solid var(--line);border-radius:5px;flex:0 0 16px;margin-top:3px;
  transition:.12s;position:relative}
.tk-box:hover{border-color:var(--accent)}
.tk-box.on{background:var(--accent);border-color:var(--accent)}
.tk-box.on::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;
  border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(42deg)}
.tk-b{flex:1;min-width:0}
.tk-t{font-size:13.5px;line-height:1.5}
.task.done .tk-t{color:var(--muted);text-decoration:line-through}
.tk-m{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.pri{width:3px;height:14px;border-radius:2px;background:var(--line);flex:0 0 3px;margin-top:5px}
.pri.h{background:var(--danger)} .pri.m{background:var(--now)}
.ed{opacity:0;font-size:11px;color:var(--muted);padding:2px 6px;border-radius:6px}
.task:hover .ed{opacity:1}
.ed:hover{background:var(--surface2);color:var(--ink)}
.over{color:var(--danger)!important}

/* ---------- timeline ---------- */
.tl{position:relative;margin-left:52px;border-left:1px solid var(--line);min-height:200px}
.tl-h{position:absolute;left:-52px;width:44px;text-align:right;font-family:var(--mono);font-size:10.5px;
  color:var(--muted);transform:translateY(-6px)}
.tl-line{position:absolute;left:0;right:0;height:1px;background:var(--line);opacity:.5}
.tl-ev{position:absolute;left:8px;right:6px;background:var(--accent-soft);border-left:2.5px solid var(--accent);
  border-radius:0 8px 8px 0;padding:4px 10px;overflow:hidden;cursor:pointer;transition:filter .12s}
.tl-ev:hover{filter:brightness(.96)}
.tl-ev b{font-size:12.5px;font-weight:600;display:block;line-height:1.4}
.tl-ev span{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.tl-now{position:absolute;left:-6px;right:0;height:2px;background:var(--now);z-index:5;border-radius:2px}
.tl-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:99px;background:var(--now)}
.tl-scroll{max-height:520px;overflow-y:auto;padding:14px 0 30px;position:relative}

/* ---------- list items ---------- */
.li{padding:13px 16px;border:1px solid var(--line);border-radius:11px;background:var(--surface);
  cursor:pointer;transition:border-color .12s}
.li:hover{border-color:var(--accent)}
.li b{font-size:14px;font-weight:600;display:block}
.li p{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:8px}

/* ---------- books ---------- */
.bk{border:1px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;transition:border-color .12s}
.bk:hover{border-color:var(--accent)}
.bk-cv{height:118px;background:var(--surface2);display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:26px;color:var(--muted);background-size:cover;background-position:center}
.bk-b{padding:11px 13px}
.bk-b b{font-size:12.5px;font-weight:600;display:block;line-height:1.5}
.bk-b span{font-size:11px;color:var(--muted)}

/* ---------- money ---------- */
.stat{padding:15px 18px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
.stat span{font-size:10.5px;letter-spacing:.1em;color:var(--muted);font-family:var(--mono)}
.stat b{display:block;font-size:22px;font-weight:600;margin-top:5px;font-family:var(--mono);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat small{font-size:11px;color:var(--muted);display:block;margin-top:3px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12px}
.bar-l{width:66px;flex:0 0 66px;color:var(--ink2)}
.bar-t{flex:1;height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar-f{height:100%;background:var(--accent);border-radius:99px}
.bar-v{width:74px;text-align:right;font-family:var(--mono);color:var(--muted);font-size:11.5px}
.tx{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border:none}
.tx:hover{background:var(--surface2)}
.tx-d{font-family:var(--mono);font-size:11px;color:var(--muted);width:44px;flex:0 0 44px}
.tx-a{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.inc{color:var(--accent)}

/* ---------- reflective pages ---------- */
.mincho{font-family:var(--serif)}
.mincho .fld-l{font-family:var(--sans)}
.sec{margin-bottom:14px}
.sec-h{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.08em;margin-bottom:8px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec-b{font-family:var(--serif);font-size:14.5px;line-height:2.1;white-space:pre-wrap;color:var(--ink2)}
.sec-b.ph2{color:var(--muted);font-style:normal;font-family:var(--sans);font-size:13px}
.goal{padding:12px 15px;border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer;
  margin-bottom:8px}
.goal:hover{border-color:var(--accent)}
.gp{height:5px;background:var(--surface2);border-radius:99px;margin-top:9px;overflow:hidden}
.gp i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(12,20,22,.42);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:56px 20px;overflow-y:auto}
.md{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;
  box-shadow:0 22px 60px rgba(0,0,0,.24)}
.md.wide{max-width:720px}
.md-h{padding:18px 24px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.md-h b{font-size:15px;font-weight:600;flex:1}
.md-b{padding:20px 24px;max-height:60vh;overflow-y:auto}
.md-f{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.fld{margin-bottom:14px}
.fld-l{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.04em}
.fld input,.fld textarea,.fld select{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);transition:border-color .12s}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.fld textarea{resize:vertical;min-height:74px;line-height:1.8}
.fld .hint{font-size:11px;color:var(--muted);margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--danger);font-size:12px}
.x{width:26px;height:26px;border-radius:7px;color:var(--muted);font-size:16px;line-height:1}
.x:hover{background:var(--surface2);color:var(--ink)}

/* search */
.sres{padding:10px 13px;border-radius:9px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.sres:hover{background:var(--surface2)}
.sres .k{font-size:10px;font-family:var(--mono);color:var(--muted);width:52px;flex:0 0 52px;letter-spacing:.06em}
.sres b{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 18px;border-radius:99px;font-size:12.5px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2)}

html,body{height:100%;margin:0;background:#F2F4F3}
#app{height:100vh;border:none;border-radius:0}
.main{max-height:none}
.gate{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;
  align-items:center;justify-content:center;padding:24px}
.gate-b{width:100%;max-width:360px;text-align:center}
.gate-m{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--muted)}
.gate-t{font-size:26px;font-weight:600;margin:10px 0 6px;letter-spacing:.02em}
.gate-p{font-size:13px;color:var(--muted);line-height:1.9;margin-bottom:22px}
.gate input{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);margin-bottom:9px;text-align:center}
.gate input:focus{outline:none;border-color:var(--accent)}
.gate .btn{width:100%;padding:10px}
.gate-n{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.8}
.gate-e{font-size:12px;margin-top:12px}
.mob{display:none}
@media(max-width:820px){
  #app{flex-direction:column}
  .sb{width:100%;flex:none;flex-direction:row;overflow-x:auto;padding:10px;border-right:none;
    border-bottom:1px solid var(--line);align-items:center;gap:4px}
  .sb-brand{display:none}
  .sb-status{display:none}
  .sb-foot{border:none;margin:0;padding:0;order:2;flex:0 0 auto;width:auto}
  .sb-foot button{flex:0 0 auto;padding:6px 9px;font-size:11.5px;white-space:nowrap}
  .nav{flex:1 1 auto;min-width:0;overflow-x:auto}
  .nav{flex-direction:row;flex-wrap:nowrap}
  .nav button{white-space:nowrap;padding:6px 11px;font-size:12.5px}
  .nav .sep{display:none}
  .wrap{padding:22px 18px 60px}
  .g2,.g3{grid-template-columns:1fr}
  .mob{display:block}
  .hero{gap:16px;padding:18px}.hero-sep{display:none}.hero-time{font-size:34px}
}
@media(prefers-reduced-motion:reduce){#app *{transition:none!important}}
</style>

<aside class="sb">
  <div class="sb-brand"><b>Life OS</b><span>PERSONAL</span></div>
  <nav class="nav" id="nav"></nav>
  <div class="sb-status" id="sstat"></div>
  <div class="sb-foot">
    <button id="btheme">◐ テーマ</button>
    <button id="bsync">☁ 同期</button>
    <button id="bexp">↓ 書き出し</button>
    <button id="bimp">↑ 読み込み</button>
  </div>
  <input type="file" id="fimp" accept="application/json,.json" style="display:none">
</aside>
<main class="main"><div class="wrap" id="view"></div></main>
</div>

<script>
(function(){
const app=document.getElementById('app'),view=document.getElementById('view');
const KEY='lifeos:data:v1';
let S={tasks:[],schedules:[],meetings:[],books:[],goals:[],files:[],transactions:[],diaries:[],
  vision:{},settings:{theme:'light'}};
let page='home', tab={}, q={};

/* ---------- utils ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const thisYM=()=>today().slice(0,7);
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const toMin=t=>{if(!t)return 0;const[a,b]=t.split(':').map(Number);return a*60+(b||0);};
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const jpDate=s=>{if(!s)return'';const d=new Date(s+'T00:00:00');
  return (d.getMonth()+1)+'月'+d.getDate()+'日('+['日','月','火','水','木','金','土'][d.getDay()]+')';};
const jpYM=s=>s?s.split('-')[0]+'年'+Number(s.split('-')[1])+'月':'';
const tags=s=>String(s||'').split(/[,、\s]+/).filter(Boolean);

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}

/* ---------- storage & sync ----------
   保存先はこの2つのオブジェクトに閉じ込めてある。
   local : この端末のブラウザ（常に書く。オフラインでも動く）
   cloud : Supabase（設定＋ログイン済みのときだけ書く。端末間で同期される）  */
const CFGK='lifeos:cloud';
const local={
  async get(){
    if(window.storage&&window.storage.get){const r=await window.storage.get(KEY);return r&&r.value;}
    return window.localStorage.getItem(KEY);
  },
  async set(v){
    if(window.storage&&window.storage.set){await window.storage.set(KEY,v);return;}
    window.localStorage.setItem(KEY,v);
  }
};
const cloud={
  sb:null,user:null,err:null,synced:null,
  cfg(){try{return JSON.parse(window.localStorage.getItem(CFGK)||'null');}catch(e){return null;}},
  setCfg(c){window.localStorage.setItem(CFGK,JSON.stringify(c));},
  clearCfg(){window.localStorage.removeItem(CFGK);this.sb=null;this.user=null;this.synced=null;},
  on(){return !!(this.sb&&this.user);},
  async init(){
    const c=this.cfg();
    if(!c)return false;
    if(!window.supabase){this.err='同期ライブラリを読み込めませんでした';return false;}
    try{
      this.sb=window.supabase.createClient(c.url,c.key);
      const{data}=await this.sb.auth.getSession();
      this.user=data&&data.session?data.session.user:null;
      this.err=null;return true;
    }catch(e){this.err=e.message||'接続できませんでした';return false;}
  },
  async pull(){
    const{data,error}=await this.sb.from('app_data').select('data')
      .eq('user_id',this.user.id).maybeSingle();
    if(error)throw error;
    return data?data.data:null;
  },
  async push(obj){
    const{error}=await this.sb.from('app_data').upsert({
      user_id:this.user.id,data:obj,updated_at:new Date().toISOString()});
    if(error)throw error;
    this.synced=new Date();
  }
};
let inflight=false,dirty=false,lastSaved=null,storeOK=null;

async function load(){
  try{
    const v=await local.get();
    if(v)S=Object.assign(S,JSON.parse(v));
    storeOK=true;
  }catch(e){storeOK=false;}
  app.dataset.theme=(S.settings&&S.settings.theme)||'light';
  status();
}
async function syncBoot(){
  if(!(await cloud.init())){gate(cloud.err||'');status();return;}
  if(!cloud.user){gate();status();return;}
  ungate();
  try{
    const r=await cloud.pull();
    const mine=S.updatedAt||0, theirs=(r&&r.updatedAt)||0;
    if(r&&theirs>mine){                 // 別の端末の方が新しい → 取り込む
      S=Object.assign(S,r);
      await local.set(JSON.stringify(S));
      render();toast('別の端末の変更を取り込みました');
    }else if(!r||mine>theirs){          // こちらが新しい → 送る
      await cloud.push(S);
    }else{cloud.synced=new Date();}
    cloud.err=null;
  }catch(e){cloud.err=e.message||'同期できませんでした';}
  status();
}
async function save(){
  S.updatedAt=Date.now();
  dirty=true;
  if(inflight)return;
  inflight=true;
  while(dirty){
    dirty=false;
    try{await local.set(JSON.stringify(S));storeOK=true;lastSaved=new Date();}
    catch(e){storeOK=false;toast('保存できません。「書き出し」でJSONを控えてください');break;}
    if(cloud.on()){
      try{await cloud.push(S);cloud.err=null;}
      catch(e){cloud.err=e.message||'同期できませんでした';}
    }
  }
  inflight=false;status();
}
function status(){
  const b=document.getElementById('bsync');
  if(b){
    if(storeOK===false)b.textContent='⚠ 保存';
    else if(cloud.on())b.textContent=cloud.err?'⚠ 同期':'☁ 同期済';
    else if(cloud.cfg())b.textContent='⚠ 要ログイン';
    else b.textContent='☁ 同期';
  }
  const el=document.getElementById('sstat');if(!el)return;
  const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
  if(storeOK===false){el.className='sb-status ng';el.textContent='⚠ 保存できていません';return;}
  if(cloud.on()){
    if(cloud.err){el.className='sb-status ng';el.textContent='⚠ 同期できていません';}
    else{el.className='sb-status';el.textContent='☁ 同期済み '+hm(cloud.synced||lastSaved||new Date());}
  }else if(cloud.cfg()){
    el.className='sb-status ng';el.textContent='☁ ログインしてください';
  }else{
    el.className='sb-status';
    el.textContent=lastSaved?'保存済み '+hm(lastSaved)+'（この端末のみ）':'この端末にのみ保存されます';
  }
}

/* ログインゲート：未ログインならアプリ本体を出さない */
function gate(msg,isErr){
  let g=document.getElementById('gate');
  if(!g){g=document.createElement('div');g.id='gate';g.className='gate';document.body.appendChild(g);}
  const c=cloud.cfg();
  g.innerHTML=`<div class="gate-b">
    <div class="gate-m">LIFE OS</div>
    <div class="gate-t">おかえりなさい</div>
    <div class="gate-p">${c?'登録済みのメールアドレスにリンクを送ります。<br>パスワードはありません。'
      :'最初にクラウド同期の設定が必要です。'}</div>
    ${c?`<input id="gmail" type="email" placeholder="メールアドレス" autocomplete="email">
        <button class="btn" id="gsend">ログインリンクを送る</button>`
       :`<input id="gurl" placeholder="Project URL">
        <input id="gkey" placeholder="publishable key">
        <button class="btn" id="gset">設定する</button>`}
    <div class="gate-e ${isErr?'err':'muted'}">${msg?esc(msg):''}</div>
    <div class="gate-n">このアプリは個人用です。<br>
      アクセスできるのは登録済みの本人だけです。</div></div>`;
  const s=g.querySelector('#gsend');
  if(s)s.onclick=async()=>{
    const em=g.querySelector('#gmail').value.trim();
    if(!em){gate('メールアドレスを入力してください',1);return;}
    s.disabled=true;s.textContent='送信中…';
    try{
      const{error}=await cloud.sb.auth.signInWithOtp({email:em,
        options:{shouldCreateUser:false,emailRedirectTo:location.href.split('#')[0].split('?')[0]}});
      if(error)throw error;
      gate('メールを送りました。届いたリンクをこのブラウザで開いてください。リンクは1時間で無効になります。');
    }catch(e){
      const m=(e.message||'').toLowerCase();
      gate(m.includes('not found')||m.includes('signup')||m.includes('not allowed')
        ?'このメールアドレスは登録されていません。':'送信できませんでした。'+(e.message||''),1);
    }
  };
  const st=g.querySelector('#gset');
  if(st)st.onclick=async()=>{
    const u=g.querySelector('#gurl').value.trim(),k=g.querySelector('#gkey').value.trim();
    if(!u||!k){gate('両方を入力してください',1);return;}
    cloud.setCfg({url:u.replace(/\/+$/,''),key:k});
    await cloud.init();gate();
  };
}
function ungate(){const g=document.getElementById('gate');if(g)g.remove();}

/* 同期の設定パネル */
function syncPanel(){
  const c=cloud.cfg();
  if(!c){
    openForm({title:'クラウド同期を設定する',ok:'設定する',fields:[
      {key:'url',label:'Project URL',req:1,ph:'https://xxxxxxxx.supabase.co',
       hint:'Supabase の Project Settings → Data API に表示されます'},
      {key:'key',label:'anon / publishable key',req:1,
       hint:'公開してよい方のキーです。secret と書かれたキーは絶対に使わないでください'}
    ],onSave:async v=>{
      cloud.setCfg({url:v.url.replace(/\/+$/,''),key:v.key.trim()});
      await cloud.init();syncPanel();
    }});
    return;
  }
  if(!cloud.user){
    openForm({title:'ログイン',ok:'ログインリンクを送る',fields:[
      {key:'email',label:'メールアドレス',type:'email',req:1,
       hint:'このアドレスにログイン用のリンクが届きます。パスワードはありません'}
    ],onSave:async v=>{
      try{
        const{error}=await cloud.sb.auth.signInWithOtp({email:v.email,
          options:{emailRedirectTo:location.href.split('#')[0]}});
        if(error)throw error;
        toast('メールを送りました。届いたリンクを開いてください');
      }catch(e){toast('送信できませんでした：'+(e.message||''));}
    },onDelete:()=>{cloud.clearCfg();commit('同期設定を消しました');}});
    return;
  }
  openView('クラウド同期',`
    <p style="font-size:13px;margin-bottom:6px">ログイン中：<b>${esc(cloud.user.email||'')}</b></p>
    <p class="muted" style="font-size:12px;margin-bottom:16px">
      ${cloud.err?'<span class="err">'+esc(cloud.err)+'</span>':
        'このアカウントでログインした端末すべてで、同じデータが見られます。'}</p>
    <div class="row" style="gap:8px">
      <button class="btn" id="doPull">別の端末の内容を取り込む</button>
      <button class="btn ghost" id="doOut">ログアウト</button></div>`);
  const p=document.querySelector('#doPull'),o=document.querySelector('#doOut');
  if(p)p.onclick=async()=>{
    try{
      const r=await cloud.pull();
      if(!r){toast('クラウドにはまだデータがありません');return;}
      if(!confirm('この端末の内容を、クラウド側の内容で置き換えます。よろしいですか。'))return;
      S=Object.assign(S,r);closeModal();commit('取り込みました');
    }catch(e){toast('取り込めませんでした：'+(e.message||''));}
  };
  if(o)o.onclick=async()=>{
    try{await cloud.sb.auth.signOut();}catch(e){}
    cloud.user=null;closeModal();status();gate();
  };
}

function closeModal(){const o=document.querySelector('.ov');if(o)o.remove();}
function openForm(cfg){
  closeModal();
  const ov=document.createElement('div');ov.className='ov';
  const fields=cfg.fields.map(f=>{
    const v=f.value==null?'':f.value;
    let inp;
    if(f.type==='textarea')inp=`<textarea id="f_${f.key}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
    else if(f.type==='select')inp=`<select id="f_${f.key}">`+f.options.map(o=>
      `<option value="${esc(o)}"${o===v?' selected':''}>${esc(o)}</option>`).join('')+`</select>`;
    else inp=`<input id="f_${f.key}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"${f.type==='time'?' step="60"':''}${f.type==='number'?' inputmode="numeric"':''}>`;
    return `<div class="fld${f.half?' h':''}"><label class="fld-l" for="f_${f.key}">${esc(f.label)}${f.req?' <span class="err">*</span>':''}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
  });
  let body='';
  for(let i=0;i<cfg.fields.length;i++){
    if(cfg.fields[i].half&&cfg.fields[i+1]&&cfg.fields[i+1].half){
      body+=`<div class="f2">${fields[i]}${fields[i+1]}</div>`;i++;
    }else body+=fields[i];
  }
  ov.innerHTML=`<div class="md${cfg.wide?' wide':''}" role="dialog" aria-modal="true">
    <div class="md-h"><b>${esc(cfg.title)}</b><button class="x" data-c>×</button></div>
    <div class="md-b">${body}<div class="err" id="ferr"></div></div>
    <div class="md-f">${cfg.onDelete?'<button class="btn ghost sm" data-del>削除</button>':''}
      <div class="sp"></div><button class="btn ghost" data-c>キャンセル</button>
      <button class="btn" data-ok>${esc(cfg.ok||'保存する')}</button></div></div>`;
  document.body.appendChild(ov);
  const first=ov.querySelector('input,textarea,select');if(first)first.focus();
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
  ov.querySelectorAll('[data-c]').forEach(b=>b.onclick=closeModal);
  ov.querySelector('[data-ok]').onclick=()=>{
    const vals={};let bad=null;
    cfg.fields.forEach(f=>{
      const el=ov.querySelector('#f_'+f.key);vals[f.key]=el?el.value.trim():'';
      if(f.req&&!vals[f.key]&&!bad)bad=f.label;
    });
    if(bad){ov.querySelector('#ferr').textContent=bad+'を入力してください';return;}
    closeModal();cfg.onSave(vals);
  };
  const d=ov.querySelector('[data-del]');
  if(d)d.onclick=()=>{if(confirm('削除します。元に戻せません。'))
    {closeModal();cfg.onDelete();}};
}

    {key:'memo',label:'メモ',type:'textarea',rows:2,value:f.memo},
  ],onSave:v=>{
    const o={...f,...v,tags:tags(v.tagsRaw)};delete o.tagsRaw;
    if(isNew){o.id=uid();o.createdAt=today();o.fav=false;S.files.push(o);}
    else S.files=S.files.map(x=>x.id===f.id?o:x);
    commit(isNew?'登録しました':'保存しました');
  },onDelete:isNew?null:()=>{S.files=S.files.filter(x=>x.id!==f.id);commit('削除しました');}});
}

/* ---------- shared renderers ---------- */
function taskRow(t,drag){
  const over=t.due&&t.due<today()&&!t.done;
  return `<div class="task${t.done?' done':''}" data-tid="${t.id}"${drag?' draggable="true"':''}>
    <div class="pri ${t.priority==='高'?'h':t.priority==='中'?'m':''}"></div>
    <div class="tk-box${t.done?' on':''}" data-tog="${t.id}" role="checkbox" tabindex="0"
      aria-checked="${t.done}" aria-label="${esc(t.title)}"></div>
    <div class="tk-b"><div class="tk-t">${esc(t.title)}</div>
      <div class="tk-m">${t.due?`<span class="${over?'over':''}">${over?'期限切れ ':''}${jpDate(t.due)}</span>`:''}
      ${t.category?`<span class="chip">${esc(t.category)}</span>`:''}
      ${(t.tags||[]).map(x=>`<span class="chip">#${esc(x)}</span>`).join('')}</div></div>
    <button class="ed" data-ted="${t.id}">編集</button></div>`;
}
function bindTasks(){
  view.querySelectorAll('[data-tog]').forEach(el=>{
    const go=()=>{const t=S.tasks.find(x=>x.id===el.dataset.tog);t.done=!t.done;t.updatedAt=Date.now();commit();};
    el.onclick=go;el.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();go();}};
  });
  view.querySelectorAll('[data-ted]').forEach(el=>el.onclick=()=>
    taskForm(S.tasks.find(x=>x.id===el.dataset.ted)));
  let src=null;
  view.querySelectorAll('.task[draggable]').forEach(el=>{
    el.ondragstart=()=>{src=el;el.classList.add('drag');};
    el.ondragend=()=>{el.classList.remove('drag');src=null;};
    el.ondragover=e=>{e.preventDefault();};
    el.ondrop=e=>{e.preventDefault();if(!src||src===el)return;
      const a=S.tasks.findIndex(x=>x.id===src.dataset.tid),b=S.tasks.findIndex(x=>x.id===el.dataset.tid);
      const[m]=S.tasks.splice(a,1);S.tasks.splice(b,0,m);S.tasks.forEach((t,i)=>t.order=i);commit();};
  });
}
function timeline(date,compact){
  const evs=S.schedules.filter(s=>s.date===date).sort((a,b)=>toMin(a.start)-toMin(b.start));
  if(compact){
    if(!evs.length)return `<div class="empty">今日の予定はまだありません<br>
      <button class="btn ghost sm" data-qa="sched" style="margin-top:8px">予定を追加する</button></div>`;
    const n=nowMin();
    return `<div class="stack">`+evs.map(s=>{
      const cur=date===today()&&toMin(s.start)<=n&&n<toMin(s.end);
      return `<div class="row" data-sed="${s.id}" style="cursor:pointer;gap:12px;padding:5px 0">
        <span class="mono muted" style="font-size:11.5px;width:82px;flex:0 0 82px">${s.start}–${s.end}</span>
        <span style="font-size:13px;font-weight:${cur?'600':'400'};flex:1">${esc(s.title)}</span>
        ${cur?'<span class="chip warn">いま</span>':''}</div>`;}).join('')+`</div>`;
  }
  const H=64,n=nowMin(),isT=date===today();
  let h='';
  for(let i=0;i<24;i++)h+=`<div class="tl-line" style="top:${i*H}px"></div>
    <div class="tl-h" style="top:${i*H}px">${pad(i)}:00</div>`;
  h+=evs.map(s=>{
    const a=toMin(s.start),b=toMin(s.end),lt=S.tasks.find(t=>t.id===s.taskId);
    return `<div class="tl-ev" data-sed="${s.id}" style="top:${a/60*H}px;height:${Math.max(22,(b-a)/60*H-3)}px">
      <b>${esc(s.title)}</b><span>${s.start}–${s.end}${s.category?' · '+esc(s.category):''}${lt?' · ↳'+esc(lt.title):''}</span></div>`;
  }).join('');
  if(isT)h+=`<div class="tl-now" id="nowline" style="top:${n/60*H}px"></div>`;
  return `<div class="tl-scroll" id="tls"><div class="tl" style="height:${24*H}px">${h}</div></div>`;
}
function bindSched(){
  view.querySelectorAll('[data-sed]').forEach(el=>el.onclick=()=>
    schedForm(S.schedules.find(x=>x.id===el.dataset.sed)));
}
function monthOf(ym){
  const t=S.transactions.filter(x=>(x.date||'').startsWith(ym));
  const inc=t.filter(x=>x.type==='収入').reduce((s,x)=>s+x.amount,0);
  const exp=t.filter(x=>x.type==='支出').reduce((s,x)=>s+x.amount,0);
  return{t,inc,exp,bal:inc-exp};
}
function prevYM(ym){const[y,m]=ym.split('-').map(Number);
  return m===1?(y-1)+'-12':y+'-'+pad(m-1);}

      `<div style="margin-bottom:9px"><div class="fld-l">${l}</div>
       <div class="sec-b" style="max-height:56px;overflow:hidden">${esc(d[k])}</div></div>`).join('')||
      '<div class="empty">まだ何も書かれていません</div>'}
    <p class="muted" style="font-size:11.5px;margin-top:6px;font-family:var(--sans)">開いて全文を読む →</p></div>`).join(''):
  `<div class="card"><div class="empty"><b>まだ日記がありません</b>
    月末に15分だけ、この月に何があったかを書き残しておきましょう</div></div>`}`;
}};

/* ---------- search ---------- */
function openSearch(){
  closeModal();
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="md"><div class="md-h" style="padding:12px 16px">
    <input class="sr" id="gq" placeholder="すべてを検索（タスク・議事録・本・目標・資料・お金・日記）"
      style="border:none;background:transparent;font-size:15px" autocomplete="off"></div>
    <div class="md-b" id="gres" style="padding:8px 11px"><p class="empty">キーワードを入力してください</p></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
  const i=ov.querySelector('#gq'),r=ov.querySelector('#gres');i.focus();
  i.oninput=()=>{
    const k=i.value.trim().toLowerCase();
    if(!k){r.innerHTML='<p class="empty">キーワードを入力してください</p>';return;}
    const hit=[];
    const scan=(arr,kind,label,act)=>arr.forEach(x=>{
      if(JSON.stringify(x).toLowerCase().includes(k))hit.push({kind,t:label(x),act:()=>act(x)});});
    scan(S.tasks,'タスク',x=>x.title,x=>{closeModal();taskForm(x);});
    scan(S.schedules,'予定',x=>x.date+' '+x.start+' '+x.title,x=>{closeModal();schedForm(x);});
    scan(S.meetings,'議事録',x=>x.name,x=>{closeModal();viewMeeting(x);});
    scan(S.books,'本',x=>x.title,x=>{closeModal();viewBook(x);});
    scan(S.goals,'目標',x=>x.title,x=>{closeModal();goalForm(x);});
    scan(S.files,'資料',x=>x.name,x=>{closeModal();fileForm(x);});
    scan(S.transactions,'家計',x=>x.date+' '+(x.content||x.category)+' '+yen(x.amount),x=>{closeModal();txForm(x);});
    scan(S.diaries,'日記',x=>jpYM(x.ym)+'の日記',x=>{closeModal();diaryForm(x.ym);});
    r.innerHTML=hit.length?hit.slice(0,30).map((h,n)=>
      `<div class="sres" data-h="${n}"><span class="k">${h.kind}</span><b>${esc(h.t)}</b></div>`).join(''):
      '<p class="empty">見つかりませんでした</p>';
    r.querySelectorAll('[data-h]').forEach(el=>el.onclick=()=>hit[+el.dataset.h].act());
  };
}
function viewMeeting(m){
  const box=(l,v,cls)=>v?`<div class="sec"><div class="fld-l">${l}</div>
    <div class="sec-b" style="font-family:var(--sans);font-size:13.5px;line-height:1.9;${cls||''}">${esc(v)}</div></div>`:'';
  openView(m.name,`<p class="muted" style="font-size:12px;margin-bottom:14px">${esc(m.date||'')}
    ${m.participants?' · '+esc(m.participants):''}${m.url?` · <a href="${esc(m.url)}" target="_blank" style="color:var(--accent)">会議URL</a>`:''}</p>
    ${box('決定事項',m.decisions,'background:var(--accent-soft);padding:11px 14px;border-radius:9px')}
    ${box('自分のToDo',m.myTodos,'background:var(--surface2);padding:11px 14px;border-radius:9px')}
    ${box('議題',m.agenda)}${box('議事録本文',m.body)}${box('次回までにやること',m.nextActions)}
    ${m.nextDate?`<p class="muted" style="font-size:12px">次回：${jpDate(m.nextDate)}</p>`:''}`,
    ()=>meetForm(m));
}
function viewBook(b){
  const box=(l,v)=>v?`<div class="sec"><div class="fld-l">${l}</div>
    <div class="sec-b">${esc(v)}</div></div>`:'';
  openView(b.title,`<p class="muted" style="font-size:12px;margin-bottom:14px">${esc(b.author||'')}
    · ${esc(b.status)}${b.rating?' · ★'+esc(b.rating):''}${b.finishedAt?' · '+jpDate(b.finishedAt):''}</p>
    ${box('本の概要',b.summary)}${box('印象に残った内容',b.impressive)}${box('学んだこと',b.learned)}
    ${box('自分の考え',b.thoughts)}${box('実際に行動したいこと',b.actions)}${box('引用・メモ',b.quotes)}`,
    ()=>bookForm(b));
}

/* ---------- nav / render ---------- */
const NAV=[['home','ホーム','◇'],['todo','ToDo','☑'],['schedule','スケジュール','◷'],'sep',
  ['meetings','議事録','▤'],['books','読書','◫'],['files','資料','⌸'],'sep',
  ['vision','Vision と目標','◈'],['money','家計簿','¥'],['diary','月に書く日記','✎']];

function renderNav(){
  document.getElementById('nav').innerHTML=NAV.map(n=>n==='sep'?'<div class="sep"></div>':
    `<button data-go="${n[0]}" class="${page===n[0]?'on':''}"><span class="ic">${n[2]}</span>${n[1]}</button>`).join('');
  document.getElementById('nav').querySelectorAll('[data-go]').forEach(b=>
    b.onclick=()=>{page=b.dataset.go;render();view.parentElement.scrollTop=0;});
}
function render(){
  renderNav();
  view.className='wrap'+(['vision','diary'].includes(page)?' mincho':'');
  view.innerHTML=PAGES[page]();
  bind();
}
function bind(){
  bindTasks();bindSched();
  view.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render();});
  view.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    const[p,v]=b.dataset.tab.split(':');tab[p]=v;render();});
  view.querySelectorAll('[data-qa]').forEach(b=>b.onclick=()=>QA[b.dataset.qa]());
  view.querySelectorAll('[data-med]').forEach(b=>b.onclick=()=>viewMeeting(S.meetings.find(x=>x.id===b.dataset.med)));
  view.querySelectorAll('[data-bed]').forEach(b=>b.onclick=()=>viewBook(S.books.find(x=>x.id===b.dataset.bed)));
  view.querySelectorAll('[data-ged]').forEach(b=>b.onclick=()=>goalForm(S.goals.find(x=>x.id===b.dataset.ged)));
  view.querySelectorAll('[data-fed]').forEach(b=>b.onclick=()=>fileForm(S.files.find(x=>x.id===b.dataset.fed)));
  view.querySelectorAll('[data-xed]').forEach(b=>b.onclick=()=>txForm(S.transactions.find(x=>x.id===b.dataset.xed)));
  view.querySelectorAll('[data-ded]').forEach(b=>b.onclick=()=>diaryForm(b.dataset.ded));
  view.querySelectorAll('[data-newgoal]').forEach(b=>b.onclick=()=>goalForm(null,b.dataset.newgoal));
  view.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const f=S.files.find(x=>x.id===b.dataset.fav);f.fav=!f.fav;commit();});
  view.querySelectorAll('[data-ved]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ved,l=k==='vision'?'Vision':'大切にしたい価値観';
    openForm({title:l,fields:[{key:'v',label:l,type:'textarea',rows:9,value:S.vision[k],
      ph:k==='vision'?'5年後、どんな1日を過ごしていたいですか':'選ぶときに、何を基準にしたいですか'}],
      onSave:v=>{S.vision[k]=v.v;commit('保存しました');}});});
  const sd=view.querySelector('#sdate');if(sd)sd.onchange=()=>{q.date=sd.value;render();};
  const my=view.querySelector('#mym');if(my)my.onchange=()=>{q.ym=my.value;render();};
  ['qm:m','qb:b','qf:f'].forEach(x=>{const[id,k]=x.split(':');
    const el=view.querySelector('#'+id);
    if(el)el.oninput=()=>{q[k]=el.value;const p=el.selectionStart;render();
      const n=view.querySelector('#'+id);if(n){n.focus();n.setSelectionRange(p,p);}};});
  const tls=view.querySelector('#tls');
  if(tls){const nl=view.querySelector('#nowline');
    tls.scrollTop=nl?Math.max(0,parseFloat(nl.style.top)-160):8*64;}
}
const QA={task:()=>taskForm(),sched:()=>schedForm(null,q.date||today()),meet:()=>meetForm(),
  book:()=>bookForm(),tx:()=>txForm(),diary:()=>diaryForm(thisYM()),goal:()=>goalForm(),file:()=>fileForm()};

/* ---------- chrome ---------- */
document.getElementById('btheme').onclick=()=>{
  S.settings.theme=app.dataset.theme==='dark'?'light':'dark';
  app.dataset.theme=S.settings.theme;save();};
document.getElementById('bexp').onclick=()=>{
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='life-os-'+today()+'.json';a.click();toast('JSONで書き出しました');};

document.getElementById('bsync').onclick=()=>syncPanel();
document.getElementById('bimp').onclick=()=>document.getElementById('fimp').click();
document.getElementById('fimp').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||!Array.isArray(d.tasks))throw 0;
      if(!confirm('現在のデータを、読み込むファイルの内容で置き換えます。よろしいですか。'))return;
      S=Object.assign(S,d);app.dataset.theme=(S.settings&&S.settings.theme)||'light';
      commit('読み込みました');
    }catch(err){toast('このファイルは読み込めません（書き出したJSONを選んでください）');}
  };
  r.onerror=()=>toast('ファイルを開けませんでした');
  r.readAsText(f);e.target.value='';
};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}
  if(mod&&e.key.toLowerCase()==='j'){e.preventDefault();taskForm();}
});
setInterval(()=>{const c=document.getElementById('clock');
  if(c&&page==='home'&&!document.querySelector('.ov')){const d=new Date();
    if(c.textContent!==pad(d.getHours())+':'+pad(d.getMinutes()))render();}},20000);

gate();
view.innerHTML='<p class="empty">読み込んでいます…</p>';
load().then(render).then(syncBoot);
})();
</script>
