<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F3">
<meta name="description" content="個人用の生活管理ダッシュボード">
<title>Life OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232E6B5E'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
<style>
:root{
  --bg:#EFEAE1; --surface:#FAF7F2; --surface2:#E7E1D5; --ink:#3B3733; --ink2:#5E584F;
  --muted:#948C80; --line:#DED7C9; --accent:#8B8074; --accent-soft:#EDE4D3; --now:#BE8A4C;
  --danger:#A96A5C; --mint:#7C8A6F; --radius:22px;
  --glow:radial-gradient(1100px 620px at 88% -10%,rgba(206,160,98,.20),transparent 62%),
    radial-gradient(760px 520px at 4% 104%,rgba(110,102,88,.11),transparent 60%);
  --shadow:0 2px 12px rgba(120,100,72,.09); --shadow-lg:0 20px 48px rgba(70,58,40,.20);
  --sans:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Yu Gothic UI","Yu Gothic","Hiragino Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
#app[data-theme="dark"]{
  --bg:#201D19; --surface:#2A2622; --surface2:#35302A; --ink:#EFE8DC; --ink2:#D2C9BB;
  --muted:#9B9285; --line:#3A342D; --accent:#C7BAA6; --accent-soft:#332D26; --now:#DFA75F;
  --danger:#D08977; --mint:#9BAF8C;
  --glow:radial-gradient(1000px 580px at 86% -6%,rgba(224,167,95,.16),transparent 60%),
    radial-gradient(700px 480px at 2% 102%,rgba(0,0,0,.32),transparent 62%);
  --shadow:0 2px 12px rgba(0,0,0,.30); --shadow-lg:0 20px 48px rgba(0,0,0,.5);
}
#app *{box-sizing:border-box;margin:0;padding:0}
#app{
  font-family:var(--sans); background:var(--glow),var(--bg); background-attachment:local; color:var(--ink);
  min-height:600px; display:flex; border-radius:var(--radius); overflow:hidden;
  font-size:15px; line-height:1.85; -webkit-font-smoothing:antialiased;
}
#app button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app input,#app textarea,#app select{font-family:inherit;font-size:15px;color:var(--ink)}
#app ::selection{background:var(--accent-soft)}

/* ---------- sidebar ---------- */
.sb{width:228px;flex:0 0 228px;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:24px 14px}
.sb-brand{padding:4px 12px 20px;display:flex;flex-direction:column;gap:2px}
.sb-brand b{font-size:16px;letter-spacing:.06em;font-weight:700;color:var(--accent)}
.sb-brand span{font-size:10px;color:var(--muted);letter-spacing:.2em;font-family:var(--mono)}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 13px;border-radius:14px;
  color:var(--ink2);text-align:left;transition:background .15s,color .15s;font-size:14.5px}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .ic{width:16px;text-align:center;font-size:13px;opacity:.9}
.nav .sep{height:1px;background:var(--line);margin:10px 12px}
.sb-status{font-size:11px;color:var(--muted);padding:10px 10px 0;letter-spacing:.02em}
.sb-status.ng{color:var(--danger);font-weight:700}
.sb-foot{display:flex;flex-wrap:wrap;gap:5px;padding:10px 6px 0;border-top:1px solid var(--line);margin-top:10px}
.sb-foot button{flex:1;padding:7px 4px;border-radius:12px;font-size:11.5px;color:var(--muted)}
.sb-foot button:hover{background:var(--surface2);color:var(--ink)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;overflow-y:auto;max-height:900px}
.wrap{max-width:1000px;padding:38px 44px 90px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
.ph h1{font-size:26px;font-weight:700;letter-spacing:.02em}
.ph p{color:var(--muted);font-size:13px;margin-top:4px}
.mincho .ph h1{font-family:var(--serif);font-weight:600;letter-spacing:.08em}

/* ---------- primitives ---------- */
.card{background:var(--surface);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
.card h3{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:15px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.btn{background:var(--accent);color:#fff;padding:9px 20px;border-radius:999px;font-size:14px;font-weight:700;
  transition:transform .12s,box-shadow .15s;box-shadow:0 3px 10px rgba(110,96,74,.20)}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(110,96,74,.26)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--surface);color:var(--ink2);box-shadow:var(--shadow)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:6px 15px;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:999px;font-size:11.5px;
  background:var(--surface2);color:var(--muted);font-weight:600}
.chip.a{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:#EFE0C6;color:#8E6520}
#app[data-theme="dark"] .chip.warn{background:#382F20;color:var(--now)}
.empty{color:var(--muted);font-size:13.5px;padding:26px 0;text-align:center;line-height:2.1}
.empty b{display:block;color:var(--ink2);font-weight:700;font-size:14.5px;margin-bottom:2px}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{padding:6px 15px;border-radius:999px;font-size:13px;color:var(--muted);font-weight:600}
.tabs button:hover{background:var(--surface2)}
.tabs button.on{background:var(--accent);color:var(--surface);box-shadow:0 3px 10px rgba(110,96,74,.22)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.sr{width:100%;padding:11px 18px;border:none;border-radius:999px;background:var(--surface);
  box-shadow:var(--shadow)}
.sr:focus{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- hero ---------- */
.hero{background:linear-gradient(118deg,var(--accent-soft) 0%,var(--surface) 58%);
  border-radius:26px;padding:26px 30px;margin-bottom:18px;display:flex;gap:26px;align-items:center;
  flex-wrap:wrap;box-shadow:var(--shadow)}
.hero-me{width:62px;height:62px;border-radius:999px;overflow:hidden;flex:0 0 62px;
  box-shadow:0 3px 14px rgba(110,96,74,.22);background:var(--surface2)}
.hero-me img{width:100%;height:100%;object-fit:cover;display:block}
.hero-hi{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:6px}
.hero-time{font-family:var(--mono);font-size:46px;font-weight:600;letter-spacing:-.02em;line-height:1;
  font-variant-numeric:tabular-nums}
.hero-date{font-size:11.5px;color:var(--muted);letter-spacing:.12em;margin-top:9px;font-family:var(--mono)}
.hero-sep{width:1px;align-self:stretch;background:var(--line)}
.hero-now{flex:1;min-width:190px}
.hero-lb{font-size:11px;letter-spacing:.14em;color:var(--now);font-weight:700}
.hero-title{font-size:21px;font-weight:700;margin-top:5px}
.hero-next{font-size:13px;color:var(--muted);margin-top:8px}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.qa button{padding:8px 17px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);
  font-size:13.5px;color:var(--ink2);font-weight:600;transition:transform .12s,color .15s}
.qa button:hover{transform:translateY(-2px);color:var(--accent)}

/* ---------- task ---------- */
.task{display:flex;align-items:flex-start;gap:13px;padding:13px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.task[draggable="true"]{cursor:grab}
.task.drag{opacity:.35}
.tk-box{width:21px;height:21px;border:2px solid var(--line);border-radius:999px;flex:0 0 21px;margin-top:2px;
  transition:.15s;position:relative}
.tk-box:hover{border-color:var(--accent);transform:scale(1.08)}
.tk-box.on{background:var(--accent);border-color:var(--accent)}
.tk-box.on::after{content:"";position:absolute;left:6.5px;top:3px;width:5px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.tk-b{flex:1;min-width:0}
.tk-t{font-size:14.5px;line-height:1.6}
.task.done .tk-t{color:var(--muted);text-decoration:line-through}
.tk-m{display:flex;gap:7px;align-items:center;margin-top:5px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.pri{width:4px;height:17px;border-radius:999px;background:var(--line);flex:0 0 4px;margin-top:4px}
.pri.h{background:var(--danger)} .pri.m{background:var(--now)}
.ed{opacity:0;font-size:11.5px;color:var(--muted);padding:3px 10px;border-radius:999px}
.task:hover .ed{opacity:1}
.ed:hover{background:var(--surface2);color:var(--ink)}
.over{color:var(--danger)!important;font-weight:600}

/* ---------- timeline ---------- */
.tl{position:relative;margin-left:54px;border-left:1px solid var(--line);min-height:200px}
.tl-h{position:absolute;left:-54px;width:44px;text-align:right;font-family:var(--mono);font-size:11px;
  color:var(--muted);transform:translateY(-7px)}
.tl-line{position:absolute;left:0;right:0;height:1px;background:var(--line);opacity:.55}
.tl-ev{position:absolute;left:10px;right:8px;background:var(--accent-soft);
  border-radius:14px;padding:6px 14px;overflow:hidden;cursor:pointer;transition:transform .12s}
.tl-ev:hover{transform:translateX(2px)}
.tl-ev b{font-size:13.5px;font-weight:700;display:block;line-height:1.5}
.tl-ev span{font-size:11px;color:var(--muted);font-family:var(--mono)}
.tl-now{position:absolute;left:-7px;right:0;height:2px;background:var(--now);z-index:5;border-radius:999px}
.tl-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:999px;
  background:var(--now);box-shadow:0 0 0 4px rgba(190,138,76,.22)}
.tl-scroll{max-height:520px;overflow-y:auto;padding:16px 0 32px;position:relative}

/* ---------- list items ---------- */
.li{padding:15px 19px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);
  cursor:pointer;transition:transform .12s}
.li:hover{transform:translateY(-2px)}
.li b{font-size:14.5px;font-weight:700;display:block}
.li p{font-size:12.5px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------- books ---------- */
.bk{border-radius:18px;background:var(--surface);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);
  display:flex;flex-direction:column;transition:transform .14s}
.bk:hover{transform:translateY(-3px)}
.bk-cv{height:126px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:26px;color:var(--accent);background-size:cover;background-position:center}
.bk-b{padding:13px 15px}
.bk-b b{font-size:13px;font-weight:700;display:block;line-height:1.6}
.bk-b span{font-size:11.5px;color:var(--muted)}

/* ---------- money ---------- */
.stat{padding:18px 20px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.stat span{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:24px;font-weight:700;margin-top:6px;font-family:var(--mono);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat small{font-size:11.5px;color:var(--muted);display:block;margin-top:4px}
.bar{display:flex;align-items:center;gap:11px;margin-bottom:9px;font-size:12.5px}
.bar-l{width:70px;flex:0 0 70px;color:var(--ink2)}
.bar-t{flex:1;height:9px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar-f{height:100%;background:linear-gradient(90deg,var(--accent),#B9AB96);border-radius:999px}
.bar-v{width:80px;text-align:right;font-family:var(--mono);color:var(--muted);font-size:12px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line);
  cursor:pointer;border-radius:12px}
.tx:last-child{border-bottom:none}
.tx:hover{background:var(--surface2)}
.tx-d{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:46px;flex:0 0 46px}
.tx-a{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.inc{color:var(--mint)}

/* ---------- habits ---------- */
.ht-top{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ht-card{overflow-x:auto;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);
  padding:8px 8px 16px;margin-bottom:16px}
.ht-row{display:flex}
.ht-namecol{flex:0 0 176px;width:176px;position:sticky;left:0;z-index:2;background:var(--surface);
  display:flex;align-items:center;gap:7px;padding:0 14px;font-size:13px;font-weight:600;
  border-bottom:1px solid var(--line);min-height:40px}
.ht-namecol .htn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ht-headrow .ht-namecol{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.ht-daylabel,.ht-daycell,.ht-pct{flex:0 0 34px;width:34px;border-left:1px solid var(--line);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.ht-daylabel{flex-direction:column;font-family:var(--mono);font-size:10px;color:var(--muted);padding:5px 0;
  min-height:40px;gap:2px}
.ht-daylabel.we{color:var(--accent);font-weight:700}
.ht-daylabel.td{background:var(--accent-soft)}
.ht-pct{font-family:var(--mono);font-size:10px;color:var(--muted);min-height:32px}
.ht-check{width:18px;height:18px;border:2px solid var(--line);border-radius:6px;transition:.12s}
.ht-check:hover{border-color:var(--accent);transform:scale(1.1)}
.ht-check.on{background:var(--accent);border-color:var(--accent)}
.ht-check.on::after{content:"";display:block;margin:1px 0 0 4px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.ht-edit{opacity:0;font-size:10.5px;color:var(--muted);padding:2px 8px;border-radius:999px;flex:0 0 auto}
.ht-namecol:hover .ht-edit{opacity:1}
.ht-edit:hover{background:var(--surface2);color:var(--ink)}
.ht-sumrow .ht-namecol{color:var(--muted);font-size:11.5px}
.ht-hrate{flex:0 0 58px;width:58px;border-left:2px solid var(--line);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;
  color:var(--accent);font-size:12.5px;background:var(--accent-soft)}
.ht-headrow .ht-hrate{font-family:var(--sans);font-weight:700;color:var(--muted);font-size:11px;
  background:transparent;letter-spacing:.02em}
.ht-sumrow .ht-hrate{background:transparent;color:var(--muted)}
.ht-chartcard{position:relative}
.ht-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:11px;
  font-weight:700;padding:5px 11px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-125%);
  box-shadow:var(--shadow-lg);z-index:5;opacity:0;transition:opacity .1s}

/* ---------- reflective pages ---------- */
.mincho{font-family:var(--serif)}
.mincho .fld-l{font-family:var(--sans)}
.sec{margin-bottom:16px}
.sec-h{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.1em;margin-bottom:10px;
  padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-b{font-family:var(--serif);font-size:15px;line-height:2.2;white-space:pre-wrap;color:var(--ink2)}
.sec-b.ph2{color:var(--muted);font-family:var(--sans);font-size:13.5px}
.goal{padding:15px 18px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;
  margin-bottom:10px;transition:transform .12s}
.goal:hover{transform:translateY(-2px)}
.gp{height:8px;background:var(--surface2);border-radius:999px;margin-top:11px;overflow:hidden}
.gp i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#B9AB96);border-radius:999px;
  transition:width .4s ease}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(48,42,34,.34);backdrop-filter:blur(4px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:56px 20px;overflow-y:auto}
.md{background:var(--surface);border-radius:26px;width:100%;max-width:560px;box-shadow:var(--shadow-lg)}
.md.wide{max-width:720px}
.md-h{padding:22px 28px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.md-h b{font-size:17px;font-weight:700;flex:1}
.md-b{padding:22px 28px;max-height:60vh;overflow-y:auto}
.md-f{padding:16px 28px 20px;display:flex;gap:9px;align-items:center}
.fld{margin-bottom:16px}
.fld-l{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
.fld input,.fld textarea,.fld select{width:100%;padding:11px 15px;border:1.5px solid var(--line);
  border-radius:14px;background:var(--bg);transition:border-color .15s}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.fld textarea{resize:vertical;min-height:80px;line-height:1.9;border-radius:16px}
.fld .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.err{color:var(--danger);font-size:12.5px;font-weight:600}
.x{width:30px;height:30px;border-radius:999px;color:var(--muted);font-size:17px;line-height:1}
.x:hover{background:var(--surface2);color:var(--ink)}

/* search */
.sres{padding:12px 15px;border-radius:14px;cursor:pointer;display:flex;gap:11px;align-items:baseline}
.sres:hover{background:var(--surface2)}
.sres .k{font-size:10.5px;color:var(--accent);width:54px;flex:0 0 54px;font-weight:700}
.sres b{font-size:13.5px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:11px 22px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;box-shadow:var(--shadow-lg)}

/* gate */
.gate{position:fixed;inset:0;background:linear-gradient(160deg,var(--accent-soft),var(--bg) 55%);
  z-index:300;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-b{width:100%;max-width:370px;text-align:center}
.gate-m{font-size:11px;letter-spacing:.22em;color:var(--accent);font-weight:700}
.gate-t{font-size:29px;font-weight:700;margin:12px 0 8px;letter-spacing:.03em}
.gate-p{font-size:13.5px;color:var(--muted);line-height:2;margin-bottom:26px}
.gate input{width:100%;padding:13px 18px;border:1.5px solid transparent;border-radius:999px;
  background:var(--surface);margin-bottom:11px;text-align:center;box-shadow:var(--shadow)}
.gate input:focus{outline:none;border-color:var(--accent)}
.gate .btn{width:100%;padding:13px}
.gate-n{font-size:12px;color:var(--muted);margin-top:20px;line-height:1.9}
.gate-e{font-size:12.5px;margin-top:14px}

.mob{display:none}
@media(max-width:820px){
  #app{flex-direction:column;font-size:15.5px}
  .sb{width:100%;flex:none;flex-direction:row;overflow-x:auto;padding:10px;border-right:none;
    border-bottom:1px solid var(--line);align-items:center;gap:5px}
  .sb-brand{display:none}
  .sb-status{display:none}
  .sb-foot{border:none;margin:0;padding:0;order:2;flex:0 0 auto;width:auto}
  .sb-foot button{flex:0 0 auto;padding:7px 11px;font-size:12px;white-space:nowrap}
  .nav{flex:1 1 auto;min-width:0;overflow-x:auto;flex-direction:row;flex-wrap:nowrap}
  .nav button{white-space:nowrap;padding:7px 13px;font-size:13.5px}
  .nav .sep{display:none}
  .wrap{padding:24px 18px 70px}
  .g2,.g3{grid-template-columns:1fr}
  .mob{display:block}

// このアプリ専用の接続先。RLSを有効にしているため公開しても安全なキー。
const BUILTIN={"url":"https://brchbotdwbemakskjulp.supabase.co","key":"sb_publishable_g_9wHJkdypSAAIqpJMx0Gg_-vPz1WZX"};
const local={
  async get(){
    if(window.storage&&window.storage.get){const r=await window.storage.get(KEY);return r&&r.value;}
    return window.localStorage.getItem(KEY);
  },
  async set(v){
    if(window.storage&&window.storage.set){await window.storage.set(KEY,v);return;}
    window.localStorage.setItem(KEY,v);
  }
};
const cloud={
  sb:null,user:null,err:null,synced:null,
  cfg(){try{return JSON.parse(window.localStorage.getItem(CFGK)||'null')||BUILTIN;}catch(e){return BUILTIN;}},
  setCfg(c){window.localStorage.setItem(CFGK,JSON.stringify(c));},
  clearCfg(){window.localStorage.removeItem(CFGK);this.sb=null;this.user=null;this.synced=null;},
  on(){return !!(this.sb&&this.user);},
  async init(){
    const c=this.cfg();
    if(!c)return false;
    if(!window.supabase){this.err='同期ライブラリを読み込めませんでした';return false;}
    try{
      this.sb=window.supabase.createClient(c.url,c.key);
      const{data}=await this.sb.auth.getSession();
      this.user=data&&data.session?data.session.user:null;
      this.err=null;return true;
    }catch(e){this.err=e.message||'接続できませんでした';return false;}
  },
  async pull(){
    const{data,error}=await this.sb.from('app_data').select('data')
      .eq('user_id',this.user.id).maybeSingle();
    if(error)throw error;
    return data?data.data:null;
  },
  async push(obj){
    const{error}=await this.sb.from('app_data').upsert({
      user_id:this.user.id,data:obj,updated_at:new Date().toISOString()});
    if(error)throw error;
    this.synced=new Date();
  }
};
let inflight=false,dirty=false,lastSaved=null,storeOK=null;

async function load(){
  try{
    const v=await local.get();
    if(v)S=Object.assign(S,JSON.parse(v));
    storeOK=true;
  }catch(e){storeOK=false;}
  app.dataset.theme=(S.settings&&S.settings.theme)||'light';
  status();
}
async function syncBoot(){
  if(!(await cloud.init())){gate(cloud.err||'');status();return;}
  if(!cloud.user){gate();status();return;}
  ungate();
  try{
    const r=await cloud.pull();
    const mine=S.updatedAt||0, theirs=(r&&r.updatedAt)||0;
    if(r&&theirs>mine){                 // 別の端末の方が新しい → 取り込む
      S=Object.assign(S,r);
      await local.set(JSON.stringify(S));
      render();toast('別の端末の変更を取り込みました');
    }else if(!r||mine>theirs){          // こちらが新しい → 送る
      await cloud.push(S);
    }else{cloud.synced=new Date();}
    cloud.err=null;
  }catch(e){cloud.err=e.message||'同期できませんでした';}
  status();
}
async function save(){
  S.updatedAt=Date.now();
  dirty=true;
  if(inflight)return;
  inflight=true;
  while(dirty){
    dirty=false;
    try{await local.set(JSON.stringify(S));storeOK=true;lastSaved=new Date();}
    catch(e){storeOK=false;toast('保存できません。「書き出し」でJSONを控えてください');break;}
    if(cloud.on()){
      try{await cloud.push(S);cloud.err=null;}
      catch(e){cloud.err=e.message||'同期できませんでした';}
    }
  }
  inflight=false;status();
}
function status(){
  const b=document.getElementById('bsync');
  if(b){
    if(storeOK===false)b.textContent='⚠ 保存';
    else if(cloud.on())b.textContent=cloud.err?'⚠ 同期':'☁ 同期済';
    else if(cloud.cfg())b.textContent='⚠ 要ログイン';
    else b.textContent='☁ 同期';
  }
  const el=document.getElementById('sstat');if(!el)return;
  const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
  if(storeOK===false){el.className='sb-status ng';el.textContent='⚠ 保存できていません';return;}
  if(cloud.on()){
    if(cloud.err){el.className='sb-status ng';el.textContent='⚠ 同期できていません';}
    else{el.className='sb-status';el.textContent='☁ 同期済み '+hm(cloud.synced||lastSaved||new Date());}
  }else if(cloud.cfg()){
    el.className='sb-status ng';el.textContent='☁ ログインしてください';
  }else{
    el.className='sb-status';
    el.textContent=lastSaved?'保存済み '+hm(lastSaved)+'（この端末のみ）':'この端末にのみ保存されます';
  }
}

/* ログインゲート：未ログインならアプリ本体を出さない */
function gate(msg,isErr){
  let g=document.getElementById('gate');
  if(!g){g=document.createElement('div');g.id='gate';g.className='gate';document.body.appendChild(g);}
  const c=cloud.cfg();
  g.innerHTML=`<div class="gate-b">
    <div class="gate-m">LIFE OS</div>
    <div class="gate-t">おかえりなさい</div>
    <div class="gate-p">${c?'登録済みのメールアドレスとパスワードを<br>入力してください。'
      :'最初にクラウド同期の設定が必要です。'}</div>
    ${c?`<input id="gmail" type="email" placeholder="メールアドレス" autocomplete="username">
        <input id="gpw" type="password" placeholder="パスワード" autocomplete="current-password">
        <button class="btn" id="gsend">ログイン</button>`
       :`<input id="gurl" placeholder="Project URL">
        <input id="gkey" placeholder="publishable key">
        <button class="btn" id="gset">設定する</button>`}
    <div class="gate-e ${isErr?'err':'muted'}">${msg?esc(msg):''}</div>
    <div class="gate-n">このアプリは個人用です。<br>
      アクセスできるのは登録済みの本人だけです。</div></div>`;
  const s=g.querySelector('#gsend');
  if(s)s.onclick=async()=>{
    const em=g.querySelector('#gmail').value.trim();
    const pw=g.querySelector('#gpw').value;
    if(!em||!pw){gate('メールアドレスとパスワードを入力してください',1);return;}
    s.disabled=true;s.textContent='確認中…';
    try{
      const{error}=await cloud.sb.auth.signInWithPassword({email:em,password:pw});
      if(error)throw error;
      location.reload();
    }catch(e){
      const m=(e.message||'').toLowerCase();
      gate(m.includes('invalid login')?'メールアドレスかパスワードが違います。'
        :m.includes('not confirmed')?'メールアドレスの確認が済んでいません。'
        :'ログインできませんでした。'+(e.message||''),1);
    }
  };
  const st=g.querySelector('#gset');
  if(st)st.onclick=async()=>{
    const u=g.querySelector('#gurl').value.trim(),k=g.querySelector('#gkey').value.trim();
    if(!u||!k){gate('両方を入力してください',1);return;}
    cloud.setCfg({url:u.replace(/\/+$/,''),key:k});
    await cloud.init();gate();
  };
}
function ungate(){const g=document.getElementById('gate');if(g)g.remove();}

/* 同期の設定パネル */
function syncPanel(){
  const c=cloud.cfg();
  if(!c){
    openForm({title:'クラウド同期を設定する',ok:'設定する',fields:[
      {key:'url',label:'Project URL',req:1,ph:'https://xxxxxxxx.supabase.co',
       hint:'Supabase の Project Settings → Data API に表示されます'},
      {key:'key',label:'anon / publishable key',req:1,
       hint:'公開してよい方のキーです。secret と書かれたキーは絶対に使わないでください'}
    ],onSave:async v=>{
      cloud.setCfg({url:v.url.replace(/\/+$/,''),key:v.key.trim()});
      await cloud.init();syncPanel();
    }});
    return;
  }
  if(!cloud.user){
    openForm({title:'ログイン',ok:'ログインリンクを送る',fields:[
      {key:'email',label:'メールアドレス',type:'email',req:1,
       hint:'このアドレスにログイン用のリンクが届きます。パスワードはありません'}
    ],onSave:async v=>{
      try{
        const{error}=await cloud.sb.auth.signInWithOtp({email:v.email,
          options:{emailRedirectTo:location.href.split('#')[0]}});
        if(error)throw error;
        toast('メールを送りました。届いたリンクを開いてください');
      }catch(e){toast('送信できませんでした：'+(e.message||''));}
    },onDelete:()=>{cloud.clearCfg();commit('同期設定を消しました');}});
    return;
  }
  openView('クラウド同期',`
    <p style="font-size:13px;margin-bottom:6px">ログイン中：<b>${esc(cloud.user.email||'')}</b></p>
    <p class="muted" style="font-size:12px;margin-bottom:16px">
      ${cloud.err?'<span class="err">'+esc(cloud.err)+'</span>':
        'このアカウントでログインした端末すべてで、同じデータが見られます。'}</p>
    <div class="row" style="gap:8px">
      <button class="btn" id="doPull">別の端末の内容を取り込む</button>
      <button class="btn ghost" id="doOut">ログアウト</button></div>`);
  const p=document.querySelector('#doPull'),o=document.querySelector('#doOut');
  if(p)p.onclick=async()=>{
    try{
      const r=await cloud.pull();
      if(!r){toast('クラウドにはまだデータがありません');return;}
      if(!confirm('この端末の内容を、クラウド側の内容で置き換えます。よろしいですか。'))return;
      S=Object.assign(S,r);closeModal();commit('取り込みました');
    }catch(e){toast('取り込めませんでした：'+(e.message||''));}
  };
  if(o)o.onclick=async()=>{
    try{await cloud.sb.auth.signOut();}catch(e){}
    cloud.user=null;closeModal();status();gate();
  };
}

function closeModal(){const o=document.querySelector('.ov');if(o)o.remove();}
function openForm(cfg){
  closeModal();
  const ov=document.createElement('div');ov.className='ov';
  const fields=cfg.fields.map(f=>{
    const v=f.value==null?'':f.value;
    let inp;
    if(f.type==='textarea')inp=`<textarea id="f_${f.key}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
    else if(f.type==='select')inp=`<select id="f_${f.key}">`+f.options.map(o=>
      `<option value="${esc(o)}"${o===v?' selected':''}>${esc(o)}</option>`).join('')+`</select>`;
    else inp=`<input id="f_${f.key}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"${f.type==='time'?' step="60"':''}${f.type==='number'?' inputmode="numeric"':''}>`;
    return `<div class="fld${f.half?' h':''}"><label class="fld-l" for="f_${f.key}">${esc(f.label)}${f.req?' <span class="err">*</span>':''}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
  });
  let body='';
  for(let i=0;i<cfg.fields.length;i++){
    if(cfg.fields[i].half&&cfg.fields[i+1]&&cfg.fields[i+1].half){
      body+=`<div class="f2">${fields[i]}${fields[i+1]}</div>`;i++;
    }else body+=fields[i];
  }
  ov.innerHTML=`<div class="md${cfg.wide?' wide':''}" role="dialog" aria-modal="true">
    <div class="md-h"><b>${esc(cfg.title)}</b><button class="x" data-c>×</button></div>
    <div class="md-b">${body}<div class="err" id="ferr"></div></div>
    <div class="md-f">${cfg.onDelete?'<button class="btn ghost sm" data-del>削除</button>':''}
      <div class="sp"></div><button class="btn ghost" data-c>キャンセル</button>
      <button class="btn" data-ok>${esc(cfg.ok||'保存する')}</button></div></div>`;
  document.body.appendChild(ov);
  const first=ov.querySelector('input,textarea,select');if(first)first.focus();
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
  ov.querySelectorAll('[data-c]').forEach(b=>b.onclick=closeModal);
  ov.querySelector('[data-ok]').onclick=()=>{
    const vals={};let bad=null;
    cfg.fields.forEach(f=>{
      const el=ov.querySelector('#f_'+f.key);vals[f.key]=el?el.value.trim():'';
      if(f.req&&!vals[f.key]&&!bad)bad=f.label;
    });
    if(bad){ov.querySelector('#ferr').textContent=bad+'を入力してください';return;}
    closeModal();cfg.onSave(vals);
  };
  const d=ov.querySelector('[data-del]');
  if(d)d.onclick=()=>{if(confirm('削除します。元に戻せません。'))
    {closeModal();cfg.onDelete();}};
}

function bindTasks(){
  view.querySelectorAll('[data-tog]').forEach(el=>{
    const go=()=>{const t=S.tasks.find(x=>x.id===el.dataset.tog);t.done=!t.done;t.updatedAt=Date.now();commit();};
    el.onclick=go;el.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();go();}};
  });
  view.querySelectorAll('[data-ted]').forEach(el=>el.onclick=()=>
    taskForm(S.tasks.find(x=>x.id===el.dataset.ted)));
  let src=null;
  view.querySelectorAll('.task[draggable]').forEach(el=>{
    el.ondragstart=()=>{src=el;el.classList.add('drag');};
    el.ondragend=()=>{el.classList.remove('drag');src=null;};
    el.ondragover=e=>{e.preventDefault();};
    el.ondrop=e=>{e.preventDefault();if(!src||src===el)return;
      const a=S.tasks.findIndex(x=>x.id===src.dataset.tid),b=S.tasks.findIndex(x=>x.id===el.dataset.tid);
      const[m]=S.tasks.splice(a,1);S.tasks.splice(b,0,m);S.tasks.forEach((t,i)=>t.order=i);commit();};
  });
}
function timeline(date,compact){
  const evs=S.schedules.filter(s=>s.date===date).sort((a,b)=>toMin(a.start)-toMin(b.start));
  if(compact){
    if(!evs.length)return `<div class="empty">今日の予定はまだありません<br>
      <button class="btn ghost sm" data-qa="sched" style="margin-top:8px">予定を追加する</button></div>`;
    const n=nowMin();
    return `<div class="stack">`+evs.map(s=>{
      const cur=date===today()&&toMin(s.start)<=n&&n<toMin(s.end);
      return `<div class="row" data-sed="${s.id}" style="cursor:pointer;gap:12px;padding:5px 0">
        <span class="mono muted" style="font-size:11.5px;width:82px;flex:0 0 82px">${s.start}–${s.end}</span>
        <span style="font-size:13px;font-weight:${cur?'600':'400'};flex:1">${esc(s.title)}</span>
        ${cur?'<span class="chip warn">いま</span>':''}</div>`;}).join('')+`</div>`;
  }
  const H=64,n=nowMin(),isT=date===today();
  let h='';
  for(let i=0;i<24;i++)h+=`<div class="tl-line" style="top:${i*H}px"></div>
    <div class="tl-h" style="top:${i*H}px">${pad(i)}:00</div>`;
  h+=evs.map(s=>{
    const a=toMin(s.start),b=toMin(s.end),lt=S.tasks.find(t=>t.id===s.taskId);
    return `<div class="tl-ev" data-sed="${s.id}" style="top:${a/60*H}px;height:${Math.max(22,(b-a)/60*H-3)}px">
      <b>${esc(s.title)}</b><span>${s.start}–${s.end}${s.category?' · '+esc(s.category):''}${lt?' · ↳'+esc(lt.title):''}</span></div>`;
  }).join('');
  if(isT)h+=`<div class="tl-now" id="nowline" style="top:${n/60*H}px"></div>`;
  return `<div class="tl-scroll" id="tls"><div class="tl" style="height:${24*H}px">${h}</div></div>`;
}

  view.querySelectorAll('[data-sed]').forEach(el=>el.onclick=()=>

}
function monthOf(ym){
  const t=S.transactions.filter(x=>(x.date||'').startsWith(ym));
  const inc=t.filter(x=>x.type==='収入').reduce((s,x)=>s+x.amount,0);
  const exp=t.filter(x=>x.type==='支出').reduce((s,x)=>s+x.amount,0);
  return{t,inc,exp,bal:inc-exp};
}
function prevYM(ym){const[y,m]=ym.split('-').map(Number);
  return m===1?(y-1)+'-12':y+'-'+pad(m-1);}

/* ---------- habits ---------- */
function habitOn(id,d){return !!S.habitLog[id+'|'+d];}
function toggleHabit(id,d){const k=id+'|'+d;
  if(S.habitLog[k])delete S.habitLog[k];else S.habitLog[k]=1;commit();}
function monthDays(ym){
  const[y,m]=ym.split('-').map(Number),n=new Date(y,m,0).getDate(),out=[];
  for(let i=1;i<=n;i++)out.push(y+'-'+pad(m)+'-'+pad(i));
  return out;
}
function habitPct(habits,d){
  if(!habits.length)return 0;
  return Math.round(habits.filter(h=>habitOn(h.id,d)).length/habits.length*100);
}
function habitMonthPct(h,days){
  if(!days.length)return 0;
  return Math.round(days.filter(d=>habitOn(h.id,d)).length/days.length*100);
}
function habitChartSVG(dates,pcts){
  const W=Math.max(dates.length*24,320),H=132,pd=10;
  const x=i=>dates.length>1?pd+i*(W-2*pd)/(dates.length-1):W/2;
  const y=v=>pd+(H-2*pd)*(1-v/100);
  const pts=pcts.map((v,i)=>[x(i),y(v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=line+` L${x(dates.length-1).toFixed(1)},${(H-pd).toFixed(1)} L${x(0).toFixed(1)},${(H-pd).toFixed(1)} Z`;
  const gid='hg'+dates.length+dates[0];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block" id="htsvg">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".38"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${pd}" y1="${y(100).toFixed(1)}" x2="${W-pd}" y2="${y(100).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${pd}" y1="${y(50).toFixed(1)}" x2="${W-pd}" y2="${y(50).toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="${pd}" y1="${y(0).toFixed(1)}" x2="${W-pd}" y2="${y(0).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle id="htdot" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" style="opacity:0"/>
    <line id="htcur" x1="0" y1="${pd}" x2="0" y2="${H-pd}" stroke="var(--accent)" stroke-width="1" style="opacity:0"/>
  </svg>`;
}
function bindHabitChart(dates,pcts){
  const svg=view.querySelector('#htsvg');if(!svg)return;
  const tip=view.querySelector('#httip'),dot=view.querySelector('#htdot'),cur=view.querySelector('#htcur');
  if(!tip||!dot||!cur)return;
  const vb=svg.viewBox.baseVal,pd=10;
  const move=e=>{
    const r=svg.getBoundingClientRect();
    const frac=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    const i=Math.round(frac*(dates.length-1));
    const px=dates.length>1?pd+i*(vb.width-2*pd)/(dates.length-1):vb.width/2;
    const py=pd+(vb.height-2*pd)*(1-pcts[i]/100);
    dot.setAttribute('cx',px);dot.setAttribute('cy',py);dot.style.opacity=1;
    cur.setAttribute('x1',px);cur.setAttribute('x2',px);cur.style.opacity=1;
    tip.style.opacity=1;
    tip.style.left=(px/vb.width*100)+'%';tip.style.top=(py/vb.height*100)+'%';
    tip.textContent=jpDate(dates[i])+' '+pcts[i]+'%';
  };
  svg.onmousemove=move;
  svg.onmouseleave=()=>{dot.style.opacity=0;cur.style.opacity=0;tip.style.opacity=0;};
  svg.ontouchmove=e=>{if(e.touches[0])move(e.touches[0]);};
}

      ファイル本体ではなく「どこに何があるか」を記録する場所です</div></div>`}`;
},

money(){
  const ym=q.ym||thisYM(),m=monthOf(ym),p=monthOf(prevYM(ym));
  const byCat={};m.t.filter(x=>x.type==='支出').forEach(x=>byCat[x.category]=(byCat[x.category]||0)+x.amount);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const max=cats.length?cats[0][1]:1;
  const diff=m.exp-p.exp;
  return `<div class="ph"><div><h1>家計簿</h1><p>${jpYM(ym)}</p></div>
    <div class="row"><input class="sr" type="month" id="mym" value="${ym}" style="width:140px">
    <button class="btn" data-qa="tx">＋ 記録</button></div></div>
  <div class="grid g3">
    <div class="stat"><span>収入</span><b class="inc">${yen(m.inc)}</b></div>
    <div class="stat"><span>支出</span><b>${yen(m.exp)}</b>
      ${p.exp?`<small>前月比 ${diff>=0?'+':''}${yen(diff)}</small>`:''}</div>
    <div class="stat"><span>収支</span><b class="${m.bal>=0?'inc':''}">${m.bal>=0?'+':''}${yen(m.bal)}</b></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>カテゴリ別の支出</h3>
      ${cats.length?cats.map(([c,v])=>`<div class="bar"><span class="bar-l">${esc(c)}</span>
        <span class="bar-t"><i class="bar-f" style="display:block;width:${v/max*100}%"></i></span>
        <span class="bar-v">${yen(v)}</span></div>`).join(''):`<div class="empty">支出の記録がありません</div>`}</div>
    <div class="card"><h3>明細</h3>
      ${m.t.length?[...m.t].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="tx" data-xed="${x.id}">
        <span class="tx-d">${x.date.slice(5).replace('-','/')}</span>
        <span style="flex:1;font-size:13px">${esc(x.content||x.category)}</span>
        <span class="chip">${esc(x.category)}</span>
        <span class="tx-a ${x.type==='収入'?'inc':''}">${x.type==='収入'?'+':'−'}${yen(x.amount)}</span></div>`).join(''):
        `<div class="empty"><b>${jpYM(ym)}の記録はありません</b>「＋ 記録」から追加できます</div>`}</div>
  </div>`;
},

diary(){
  const list=[...S.diaries].sort((a,b)=>b.ym.localeCompare(a.ym));
  const cur=S.diaries.find(x=>x.ym===thisYM());
  return `<div class="ph"><div><h1>月に書く日記</h1><p>ひと月をふり返るための日記です</p></div>
    <button class="btn" data-qa="diary">${cur?'今月の日記を編集':'今月の日記を書く'}</button></div>
  ${list.length?list.map(d=>`<div class="card sec" data-ded="${d.ym}" style="cursor:pointer">
    <div class="sec-h">${jpYM(d.ym)}</div>
    ${DIARY.filter(([k])=>d[k]).slice(0,3).map(([k,l])=>
      `<div style="margin-bottom:9px"><div class="fld-l">${l}</div>
       <div class="sec-b" style="max-height:56px;overflow:hidden">${esc(d[k])}</div></div>`).join('')||
      '<div class="empty">まだ何も書かれていません</div>'}
    <p class="muted" style="font-size:11.5px;margin-top:6px;font-family:var(--sans)">開いて全文を読む →</p></div>`).join(''):
  `<div class="card"><div class="empty"><b>まだ日記がありません</b>
    月末に15分だけ、この月に何があったかを書き残しておきましょう</div></div>`}`;
}};

/* ---------- search ---------- */
function openSearch(){
  closeModal();
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="md"><div class="md-h" style="padding:12px 16px">
    <input class="sr" id="gq" placeholder="すべてを検索（タスク・議事録・本・目標・資料・お金・日記）"
      style="border:none;background:transparent;font-size:15px" autocomplete="off"></div>
    <div class="md-b" id="gres" style="padding:8px 11px"><p class="empty">キーワードを入力してください</p></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
  const i=ov.querySelector('#gq'),r=ov.querySelector('#gres');i.focus();
  i.oninput=()=>{
    const k=i.value.trim().toLowerCase();
    if(!k){r.innerHTML='<p class="empty">キーワードを入力してください</p>';return;}
    const hit=[];
    const scan=(arr,kind,label,act)=>arr.forEach(x=>{
      if(JSON.stringify(x).toLowerCase().includes(k))hit.push({kind,t:label(x),act:()=>act(x)});});
    scan(S.tasks,'タスク',x=>x.title,x=>{closeModal();taskForm(x);});
    scan(S.schedules,'予定',x=>x.date+' '+x.start+' '+x.title,x=>{closeModal();schedForm(x);});
    scan(S.meetings,'議事録',x=>x.name,x=>{closeModal();viewMeeting(x);});
    scan(S.books,'本',x=>x.title,x=>{closeModal();viewBook(x);});
    scan(S.goals,'目標',x=>x.title,x=>{closeModal();goalForm(x);});
    scan(S.files,'資料',x=>x.name,x=>{closeModal();fileForm(x);});
    scan(S.transactions,'家計',x=>x.date+' '+(x.content||x.category)+' '+yen(x.amount),x=>{closeModal();txForm(x);});
    scan(S.diaries,'日記',x=>jpYM(x.ym)+'の日記',x=>{closeModal();diaryForm(x.ym);});
    r.innerHTML=hit.length?hit.slice(0,30).map((h,n)=>
      `<div class="sres" data-h="${n}"><span class="k">${h.kind}</span><b>${esc(h.t)}</b></div>`).join(''):
      '<p class="empty">見つかりませんでした</p>';
    r.querySelectorAll('[data-h]').forEach(el=>el.onclick=()=>hit[+el.dataset.h].act());
  };
}
function viewMeeting(m){
  const box=(l,v,cls)=>v?`<div class="sec"><div class="fld-l">${l}</div>
    <div class="sec-b" style="font-family:var(--sans);font-size:13.5px;line-height:1.9;${cls||''}">${esc(v)}</div></div>`:'';
  openView(m.name,`<p class="muted" style="font-size:12px;margin-bottom:14px">${esc(m.date||'')}
    ${m.participants?' · '+esc(m.participants):''}${m.url?` · <a href="${esc(m.url)}" target="_blank" style="color:var(--accent)">会議URL</a>`:''}</p>
    ${box('決定事項',m.decisions,'background:var(--accent-soft);padding:11px 14px;border-radius:9px')}
    ${box('自分のToDo',m.myTodos,'background:var(--surface2);padding:11px 14px;border-radius:9px')}
    ${box('議題',m.agenda)}${box('議事録本文',m.body)}${box('次回までにやること',m.nextActions)}
    ${m.nextDate?`<p class="muted" style="font-size:12px">次回：${jpDate(m.nextDate)}</p>`:''}`,
    ()=>meetForm(m));
}
function viewBook(b){
  const box=(l,v)=>v?`<div class="sec"><div class="fld-l">${l}</div>
    <div class="sec-b">${esc(v)}</div></div>`:'';
  openView(b.title,`<p class="muted" style="font-size:12px;margin-bottom:14px">${esc(b.author||'')}
    · ${esc(b.status)}${b.rating?' · ★'+esc(b.rating):''}${b.finishedAt?' · '+jpDate(b.finishedAt):''}</p>
    ${box('本の概要',b.summary)}${box('印象に残った内容',b.impressive)}${box('学んだこと',b.learned)}
    ${box('自分の考え',b.thoughts)}${box('実際に行動したいこと',b.actions)}${box('引用・メモ',b.quotes)}`,
    ()=>bookForm(b));
}

/* ---------- nav / render ---------- */
const NAV=[['home','ホーム','◇'],['todo','ToDo','☑'],['habits','習慣','◉'],['schedule','スケジュール','◷'],'sep',
  ['meetings','議事録','▤'],['books','読書','◫'],['files','資料','⌸'],'sep',
  ['vision','Vision と目標','◈'],['money','家計簿','¥'],['diary','月に書く日記','✎']];

function renderNav(){
  document.getElementById('nav').innerHTML=NAV.map(n=>n==='sep'?'<div class="sep"></div>':
    `<button data-go="${n[0]}" class="${page===n[0]?'on':''}"><span class="ic">${n[2]}</span>${n[1]}</button>`).join('');
  document.getElementById('nav').querySelectorAll('[data-go]').forEach(b=>
    b.onclick=()=>{page=b.dataset.go;render();view.parentElement.scrollTop=0;});
}
function render(){
  renderNav();
  view.className='wrap'+(['vision','diary'].includes(page)?' mincho':'');
  view.innerHTML=PAGES[page]();
  bind();
}
function bind(){
  bindTasks();bindSched();
  view.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render();});
  view.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    const[p,v]=b.dataset.tab.split(':');tab[p]=v;render();});
  view.querySelectorAll('[data-qa]').forEach(b=>b.onclick=()=>QA[b.dataset.qa]());
  view.querySelectorAll('[data-med]').forEach(b=>b.onclick=()=>viewMeeting(S.meetings.find(x=>x.id===b.dataset.med)));
  view.querySelectorAll('[data-bed]').forEach(b=>b.onclick=()=>viewBook(S.books.find(x=>x.id===b.dataset.bed)));
  view.querySelectorAll('[data-ged]').forEach(b=>b.onclick=()=>goalForm(S.goals.find(x=>x.id===b.dataset.ged)));
  view.querySelectorAll('[data-fed]').forEach(b=>b.onclick=()=>fileForm(S.files.find(x=>x.id===b.dataset.fed)));
  view.querySelectorAll('[data-xed]').forEach(b=>b.onclick=()=>txForm(S.transactions.find(x=>x.id===b.dataset.xed)));
  view.querySelectorAll('[data-ded]').forEach(b=>b.onclick=()=>diaryForm(b.dataset.ded));
  view.querySelectorAll('[data-newgoal]').forEach(b=>b.onclick=()=>goalForm(null,b.dataset.newgoal));
  view.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const f=S.files.find(x=>x.id===b.dataset.fav);f.fav=!f.fav;commit();});
  view.querySelectorAll('[data-hed]').forEach(b=>b.onclick=()=>habitForm(S.habits.find(x=>x.id===b.dataset.hed)));
  view.querySelectorAll('[data-hcell]').forEach(el=>{
    const[hid,d]=el.dataset.hcell.split('|');
    const go=()=>toggleHabit(hid,d);
    el.onclick=e=>{e.stopPropagation();go();};
    el.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();e.stopPropagation();go();}};
  });
  view.querySelectorAll('[data-ved]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ved,l=k==='vision'?'Vision':'大切にしたい価値観';
    openForm({title:l,fields:[{key:'v',label:l,type:'textarea',rows:9,value:S.vision[k],
      ph:k==='vision'?'5年後、どんな1日を過ごしていたいですか':'選ぶときに、何を基準にしたいですか'}],
      onSave:v=>{S.vision[k]=v.v;commit('保存しました');}});});
  const sd=view.querySelector('#sdate');if(sd)sd.onchange=()=>{q.date=sd.value;render();};
  const my=view.querySelector('#mym');if(my)my.onchange=()=>{q.ym=my.value;render();};
  const hy=view.querySelector('#hym');if(hy)hy.onchange=()=>{q.hym=hy.value;render();};
  if(page==='habits'&&S.habits.length){
    const ym=q.hym||thisYM(),habits=[...S.habits].sort((a,b)=>(a.order||0)-(b.order||0));
    const days=monthDays(ym);bindHabitChart(days,days.map(d=>habitPct(habits,d)));
  }
  ['qm:m','qb:b','qf:f'].forEach(x=>{const[id,k]=x.split(':');
    const el=view.querySelector('#'+id);
    if(el)el.oninput=()=>{q[k]=el.value;const p=el.selectionStart;render();
      const n=view.querySelector('#'+id);if(n){n.focus();n.setSelectionRange(p,p);}};});
  const tls=view.querySelector('#tls');
  if(tls){const nl=view.querySelector('#nowline');
    tls.scrollTop=nl?Math.max(0,parseFloat(nl.style.top)-160):8*64;}
}
const QA={task:()=>taskForm(),sched:()=>schedForm(null,q.date||today()),meet:()=>meetForm(),
  book:()=>bookForm(),tx:()=>txForm(),diary:()=>diaryForm(thisYM()),goal:()=>goalForm(),file:()=>fileForm(),
  habit:()=>habitForm()};

/* ---------- chrome ---------- */
document.getElementById('btheme').onclick=()=>{
  S.settings.theme=app.dataset.theme==='dark'?'light':'dark';
  app.dataset.theme=S.settings.theme;save();};
document.getElementById('bexp').onclick=()=>{
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='life-os-'+today()+'.json';a.click();toast('JSONで書き出しました');};

document.getElementById('bsync').onclick=()=>syncPanel();
document.getElementById('bimp').onclick=()=>document.getElementById('fimp').click();
document.getElementById('fimp').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||!Array.isArray(d.tasks))throw 0;
      if(!confirm('現在のデータを、読み込むファイルの内容で置き換えます。よろしいですか。'))return;
      S=Object.assign(S,d);app.dataset.theme=(S.settings&&S.settings.theme)||'light';
      commit('読み込みました');
    }catch(err){toast('このファイルは読み込めません（書き出したJSONを選んでください）');}
  };
  r.onerror=()=>toast('ファイルを開けませんでした');
  r.readAsText(f);e.target.value='';
};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}
  if(mod&&e.key.toLowerCase()==='j'){e.preventDefault();taskForm();}
});
setInterval(()=>{const c=document.getElementById('clock');
  if(c&&page==='home'&&!document.querySelector('.ov')){const d=new Date();
    if(c.textContent!==pad(d.getHours())+':'+pad(d.getMinutes()))render();}},20000);

gate();
view.innerHTML='<p class="empty">読み込んでいます…</p>';
load().then(render).then(syncBoot);
})();
</script>
